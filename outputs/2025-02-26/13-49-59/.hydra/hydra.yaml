hydra:
  help:
    app_name: ${hydra.job.name}
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.'
  hydra_logging:
    disable_existing_loggers: false
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    loggers:
      logging_example:
        level: DEBUG
    root:
      handlers:
      - console
      level: INFO
    version: 1
  job:
    config:
      override_dirname:
        exclude_keys: []
        item_sep: ','
        kv_sep: '='
    config_file: null
    id: ???
    name: collect_dataset_softgym
    num: ???
    override_dirname: activation=tanh,agent.params.actor_lr=0.0003,agent.params.batch_size=512,agent.params.critic_lr=0.0003,dataset_dir=/project_data/held/sreyas/sim_data/datagen/drawer/datagen_drawer_open-Medium/old,diag_gaussian_actor.params.hidden_depth=3,diag_gaussian_actor.params.hidden_dim=256,double_q_critic.params.hidden_depth=3,double_q_critic.params.hidden_dim=256,env=metaworld_drawer-open-v2,exp_name=datagen_drawer_open-Medium,exp_name=reproduce,feed_type=0,gradient_update=1,image_reward=1,max_feedback=20000,num_eval_episodes=1000,num_interact=4000,num_train_steps=1000000,num_unsup_steps=9000,reward=learn_from_preference,reward_batch=40,reward_model_load_dir=/project_data/held/sreyas/RL-VLM-F/reward_models/Drawer_open,reward_model_load_step=999999,reward_update=10,seed=0,segment=1,teacher_beta=-1,teacher_eps_equal=0,teacher_eps_mistake=0,teacher_eps_skip=0,teacher_gamma=1,vlm=gemini_free_form,vlm_label=1
  job_logging:
    disable_existing_loggers: false
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        filename: ${hydra.job.name}.log
        formatter: simple
    root:
      handlers:
      - console
      - file
      level: INFO
    version: 1
  launcher:
    class: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  output_subdir: .hydra
  overrides:
    hydra: []
    task:
    - env=metaworld_drawer-open-v2
    - seed=0
    - exp_name=reproduce
    - reward=learn_from_preference
    - vlm_label=1
    - vlm=gemini_free_form
    - image_reward=1
    - reward_batch=40
    - segment=1
    - teacher_eps_mistake=0
    - reward_update=10
    - num_interact=4000
    - max_feedback=20000
    - agent.params.actor_lr=0.0003
    - agent.params.critic_lr=0.0003
    - gradient_update=1
    - activation=tanh
    - num_unsup_steps=9000
    - num_train_steps=1000000
    - agent.params.batch_size=512
    - double_q_critic.params.hidden_dim=256
    - double_q_critic.params.hidden_depth=3
    - diag_gaussian_actor.params.hidden_dim=256
    - diag_gaussian_actor.params.hidden_depth=3
    - feed_type=0
    - teacher_beta=-1
    - teacher_gamma=1
    - teacher_eps_skip=0
    - teacher_eps_equal=0
    - num_eval_episodes=1000
    - reward_model_load_dir=/project_data/held/sreyas/RL-VLM-F/reward_models/Drawer_open
    - reward_model_load_step=999999
    - dataset_dir=/project_data/held/sreyas/sim_data/datagen/drawer/datagen_drawer_open-Medium/old
    - exp_name=datagen_drawer_open-Medium
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  runtime:
    cwd: /project_data/held/sreyas/RL-VLM-F
    version: 0.11.3
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  sweeper:
    class: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
  verbose: false
